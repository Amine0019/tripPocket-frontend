<div class="admin-shell" [class.sidebar-open]="sidebarOpen()">
  <aside class="admin-sidebar" aria-label="Admin navigation">
    <a class="admin-brand" routerLink="/admin" (click)="closeSidebar()">
      <span class="brand-mark" aria-hidden="true">TP</span>
      <span>
        <strong>tripPocket</strong>
        <small>Admin backoffice</small>
      </span>
    </a>

    <div class="sidebar-label">Workspace</div>
    <nav class="admin-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
        <span class="nav-icon" aria-hidden="true">▦</span>
        <span>Dashboard</span>
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon" aria-hidden="true">♙</span>
        <span>Users</span>
      </a>
      <a routerLink="/admin/trips" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon" aria-hidden="true">✈</span>
        <span>Trips</span>
      </a>
      <a routerLink="/admin/activities" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon" aria-hidden="true">◇</span>
        <span>Activities</span>
      </a>
      <a routerLink="/admin/reservations" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon" aria-hidden="true">✓</span>
        <span>Reservations</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-status"><span></span> Admin access</div>
      <button class="logout-button" type="button" (click)="logout()">
        <span aria-hidden="true">↪</span>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <button class="sidebar-backdrop" type="button" aria-label="Close navigation" (click)="closeSidebar()"></button>
  }

  <section class="admin-main">
    <header class="admin-header">
      <button class="menu-button" type="button" aria-label="Open admin navigation" (click)="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <div>
        <p class="header-kicker">TripPocket / Administration</p>
        <h1>Admin workspace</h1>
      </div>
      <span class="header-role">ADMIN</span>
    </header>

    <main class="admin-content">
      <router-outlet />
    </main>
  </section>
</div>
