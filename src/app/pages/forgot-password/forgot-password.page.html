<section class="auth-wrap container">
  <form class="card auth-card" (submit)="$event.preventDefault(); submit()">
    <p class="eyebrow">Account recovery</p>
    <h1 class="display">Forgot password</h1>
    <p class="muted">Enter the email on your tripPocket account and we will send a reset link.</p>
    <div class="stack">
      <label class="field"><span>Email</span><input class="input" type="email" [(ngModel)]="email" name="email" /></label>
      <button class="btn btn-primary" type="submit">Send reset link</button>
      @if (sent()) { <p>If an account exists for that email, the message is on its way.</p> }
      <a routerLink="/login">Back to login</a>
    </div>
  </form>
</section>
