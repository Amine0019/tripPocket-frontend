<section class="page container">
  <app-page-header eyebrow="Account" title="Profile" subtitle="Manage the traveler details used across bookings." />
  <div class="split-layout">
    <form class="card pad" (submit)="save()" novalidate>
      @if (errorList().length > 0) {
        <div class="error-alert">
          <strong>Validation error:</strong>
          <ul>
            @for (err of errorList(); track err) {
              <li>{{ err }}</li>
            }
          </ul>
        </div>
      }
      <div class="form-grid">
        <label class="field"><span>First name</span><input class="input" [(ngModel)]="draft.firstName" name="first" /></label>
        <label class="field"><span>Last name</span><input class="input" [(ngModel)]="draft.lastName" name="last" /></label>
        <label class="field"><span>Email</span><input class="input" type="text" [(ngModel)]="draft.email" name="email" /></label>
        <label class="field"><span>New Password</span><input class="input" type="password" [(ngModel)]="draft.password" name="password" placeholder="Leave empty to keep current" /></label>
      </div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-primary" type="submit" [disabled]="loading()">
          @if (loading()) { Saving... } @else { Save changes }
        </button>
      </div>
    </form>
    <aside class="card pad">
      <div class="avatar">{{ user().avatarInitials }}</div>
      <h3>{{ user().firstName }} {{ user().lastName }}</h3>
      <p>{{ user().email }}</p>
    </aside>
  </div>
</section>
