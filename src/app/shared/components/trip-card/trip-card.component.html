<article class="card">
  <a [routerLink]="['/trips', trip.id]" class="media">
    <img [src]="trip.image" [alt]="trip.title" />
    @if (trip.badge) {
      <app-status-badge [badge]="trip.badge" />
    }
    <button class="heart" type="button" [class.on]="liked()" (click)="toggle($event)" aria-label="Save trip">
      <svg viewBox="0 0 24 24" width="16" height="16" [attr.fill]="liked() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
        <path d="M12 20s-7-4.4-9-8.4C1.4 8.4 3.2 5 6.6 5c2 0 3.3 1.1 4.4 2.6C12.1 6.1 13.4 5 15.4 5 18.8 5 20.6 8.4 19 11.6 17 15.6 12 20 12 20z"/>
      </svg>
    </button>
  </a>
  <div class="body">
    <div class="meta">
      <span>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 21s7-7 7-11a7 7 0 1 0-14 0c0 4 7 11 7 11z"/></svg>
        {{ trip.destination }}, {{ trip.country }}
      </span>
      <span class="rate">★ {{ trip.rating }}</span>
    </div>
    <h3><a [routerLink]="['/trips', trip.id]">{{ trip.title }}</a></h3>
    <p>{{ trip.description }}</p>
    <div class="row">
      <div>
        <small>From</small>
        <strong>{{ trip.pricePerPerson | currency:'USD':'symbol':'1.0-0' }} <em>/ person</em></strong>
      </div>
      <a class="btn-icon filled" [routerLink]="['/trips', trip.id]" aria-label="View details">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>
    </div>
  </div>
</article>
