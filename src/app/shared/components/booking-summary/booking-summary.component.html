<article>
  <img [src]="trip.image" [appImgFallback]="fallbackPhoto" [alt]="trip.title" />
  <div>
    <strong>{{ trip.title }}</strong>
    <p>
      @if (label) { {{ label }} · }{{ dates || trip.durationDays + ' days' }}<br />
      {{ travelers }} {{ travelers > 1 ? 'travelers' : 'traveler' }}
    </p>
  </div>
  <b>{{ total() | currency:'USD':'symbol':'1.0-0' }}</b>
</article>
